name: profile-stats

# Regenerates assets/stats.svg and assets/contributions.svg from the GitHub API
# (public data only) and commits them when they change.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: javoxirone
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/contributions.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
