<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t">
  <title id="t">Javohir Nurmatjonov — Python Backend Engineer</title>
  <style>
    .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .s{font-family:Inter,'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
