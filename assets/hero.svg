<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d" fill="none"><title id="t">Javohir Nurmatjonov — Python Backend Engineer</title><desc id="d">Dark terminal-style banner: the name Javohir Nurmatjonov, the title Python Backend Engineer and Team Lead, a tagline, and a small animated diagram of a client, API, Postgres, Redis, Celery worker and LLM.</desc><style>
.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
