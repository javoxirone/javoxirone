<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="t d" fill="none"><title id="t">Terminal introduction</title><desc id="d">A terminal window running whoami, current_focus, current_roles and education.</desc><style>
.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.s{font-family:Inter,'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
.in{animation:in .5s ease-out backwards}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.in{animation:none}}
</style><defs><clipPath id="c"><rect width="1000" height="570" rx="14"/></clipPath></defs><g clip-path="url(#c)"><rect width="1000" height="570" fill="#0B1011"/><rect width="1000" height="44" fill="#06090A"/><line x1="0" y1="44.5" x2="1000" y2="44.5" stroke="#1B2624"/><circle cx="28" cy="22" r="5" fill="#1B2926"/><circle cx="48" cy="22" r="5" fill="#1B2926"/><circle cx="68" cy="22" r="5" fill="#1B2926"/><text x="96" y="27" class="m" font-size="14" fill="#7C8C86">zsh — javoxirone@tashkent</text><g class="in" style="animation-delay:0.0s"><text x="40" y="100" class="m" font-size="26"><tspan fill="#3DFFA8">$</tspan><tspan fill="#E8F0EC"> whoami</tspan></text><text x="40" y="140" class="m" font-size="26" fill="#9FB3AB">Python Backend Engineer building production systems.</text></g><g class="in" style="animation-delay:0.7s"><text x="40" y="200" class="m" font-size="26"><tspan fill="#3DFFA8">$</tspan><tspan fill="#E8F0EC"> current_focus</tspan></text><text x="40" y="240" class="m" font-size="26" fill="#9FB3AB">Backend architecture / PostgreSQL / AI engineering.</text></g><g class="in" style="animation-delay:1.4s"><text x="40" y="300" class="m" font-size="26"><tspan fill="#3DFFA8">$</tspan><tspan fill="#E8F0EC"> current_roles</tspan></text><text x="40" y="340" class="m" font-size="26" fill="#9FB3AB">Smart Aurum / Techna.</text></g><g class="in" style="animation-delay:2.1s"><text x="40" y="400" class="m" font-size="26"><tspan fill="#3DFFA8">$</tspan><tspan fill="#E8F0EC"> education</tspan></text><text x="40" y="440" class="m" font-size="26" fill="#9FB3AB">Computer Science @ Webster University.</text></g><text x="40" y="500" class="m" font-size="26" fill="#3DFFA8">$</text><rect x="72" y="478" width="15" height="28" fill="#3DFFA8" class="blink"/></g><rect x=".5" y=".5" width="999" height="569" rx="14" stroke="#1B2624"/></svg>