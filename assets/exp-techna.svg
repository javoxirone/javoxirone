<svg xmlns="http://www.w3.org/2000/svg" width="900" height="723" viewBox="0 0 900 723" role="img" aria-labelledby="t d" fill="none"><title id="t">Techna — Python Backend Engineer</title><desc id="d">Techna, Python Backend Engineer, 2026 — PRESENT. Backend services, AI-powered business automation and conversational commerce. Developed an AI-powered sales assistant integrated with the Bito platform. Implemented product catalog synchronization: descriptions, characteristics, prices, stock and photos. Built conversational AI flows in Uzbek and Russian. Implemented product recommendations, upselling, order creation and order status tracking. Developed web chat backend functionality: session management, message history, cursor pagination and idempotency. Worked with RAG architecture, vector search, LLM integrations and tool calling. Stack: Python, FastAPI, SQLAlchemy, PostgreSQL, pgvector, Redis, Celery, Haystack, Vertex AI Gemini.</desc><style>.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.s{font-family:Inter,'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.blink{animation:blink 1.1s steps(1) infinite}.pulse{animation:pulse 2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.blink,.pulse{animation:none}}</style><defs><clipPath id="c"><rect width="900" height="723" rx="14"/></clipPath><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#0E1715" stroke-width="1"/></pattern></defs><g clip-path="url(#c)"><rect width="900" height="723" fill="#0B1011"/><rect width="900" height="723" fill="url(#g)"/><text x="40" y="44" class="m" font-size="13" letter-spacing="3" fill="#46544F">EXPERIENCE / 02</text><circle cx="708" cy="40" r="4" fill="#3DFFA8" class="pulse"/><text x="860" y="45" text-anchor="end" class="m" font-size="15" fill="#E8F0EC">2026 — PRESENT</text><text x="40" y="104" class="s" font-size="40" font-weight="800" fill="#E8F0EC">Techna</text><text x="40" y="138" class="m" font-size="18" fill="#3DFFA8">Python Backend Engineer</text><line x1="40" y1="164.5" x2="860" y2="164.5" stroke="#1B2624"/><text x="40" y="198" class="m" font-size="17" fill="#7C8C86">Backend services, AI-powered business automation and conversational commerce.</text><text x="40" y="238" class="m" font-size="17" fill="#3DFFA8">›</text><text x="64" y="238" class="m" font-size="17" fill="#9FB3AB">Developed an AI-powered sales assistant integrated with the Bito</text><text x="64" y="263" class="m" font-size="17" fill="#9FB3AB">platform.</text><text x="40" y="297" class="m" font-size="17" fill="#3DFFA8">›</text><text x="64" y="297" class="m" font-size="17" fill="#9FB3AB">Implemented product catalog synchronization: descriptions,</text><text x="64" y="322" class="m" font-size="17" fill="#9FB3AB">characteristics, prices, stock and photos.</text><text x="40" y="356" class="m" font-size="17" fill="#3DFFA8">›</text><text x="64" y="356" class="m" font-size="17" fill="#9FB3AB">Built conversational AI flows in Uzbek and Russian.</text><text x="40" y="390" class="m" font-size="17" fill="#3DFFA8">›</text><text x="64" y="390" class="m" font-size="17" fill="#9FB3AB">Implemented product recommendations, upselling, order creation and order</text><text x="64" y="415" class="m" font-size="17" fill="#9FB3AB">status tracking.</text><text x="40" y="449" class="m" font-size="17" fill="#3DFFA8">›</text><text x="64" y="449" class="m" font-size="17" fill="#9FB3AB">Developed web chat backend functionality: session management, message</text><text x="64" y="474" class="m" font-size="17" fill="#9FB3AB">history, cursor pagination and idempotency.</text><text x="40" y="508" class="m" font-size="17" fill="#3DFFA8">›</text><text x="64" y="508" class="m" font-size="17" fill="#9FB3AB">Worked with RAG architecture, vector search, LLM integrations and tool</text><text x="64" y="533" class="m" font-size="17" fill="#9FB3AB">calling.</text><line x1="40" y1="563.5" x2="860" y2="563.5" stroke="#1B2624"/><text x="40" y="597" class="m" font-size="13" letter-spacing="3" fill="#46544F">STACK</text><rect x="40.5" y="613.5" width="85" height="31" rx="8" fill="#0C1D17" stroke="#3DFFA8"/><text x="83.0" y="634" text-anchor="middle" class="m" font-size="16" fill="#3DFFA8">Python</text><rect x="136.5" y="613.5" width="94" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="183.5" y="634" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">FastAPI</text><rect x="241.5" y="613.5" width="123" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="303.0" y="634" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">SQLAlchemy</text><rect x="375.5" y="613.5" width="123" height="31" rx="8" fill="#0C1D17" stroke="#3DFFA8"/><text x="437.0" y="634" text-anchor="middle" class="m" font-size="16" fill="#3DFFA8">PostgreSQL</text><rect x="509.5" y="613.5" width="104" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="561.5" y="634" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">pgvector</text><rect x="624.5" y="613.5" width="75" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="662.0" y="634" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">Redis</text><rect x="710.5" y="613.5" width="85" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="753.0" y="634" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">Celery</text><rect x="40.5" y="655.5" width="104" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="92.5" y="676" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">Haystack</text><rect x="155.5" y="655.5" width="181" height="31" rx="8" fill="#0D1415" stroke="#26332F"/><text x="246.0" y="676" text-anchor="middle" class="m" font-size="16" fill="#E8F0EC">Vertex AI Gemini</text></g><rect x=".5" y=".5" width="8