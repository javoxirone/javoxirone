<svg xmlns="http://www.w3.org/2000/svg" width="900" height="589" viewBox="0 0 900 589" role="img" aria-labelledby="t d" fill="none"><title id="t">Smart Aurum — Backend Engineer</title><desc id="d">Smart Aurum / DaisyAI, Backend Engineer, 2026 — PRESENT. AI-powered personal productivity and life-balance platform. Designing the backend architecture and defining the technical MVP scope. Building REST APIs with Django and Django REST Framework. Implementing asynchronous processing with Celery and Redis. Working on integrations with external health and calendar platforms. Taking part in architecture and technical decisions and release planning, alongside a Flutter developer on the product. Stack: Python, Django 5, Django REST Framework, PostgreSQL, Redis, Celery, AWS, Firebase.</desc><style>.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}.s{font-family:Inter,'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.blink{animation:blink 1.1s steps(1) infinite}.pulse{animation:pulse 2s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.blink,.pulse{animation:none}}</style><defs><clipPath id="c"><rect width="900" height="589" rx="14"/></clipPath><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#0E1715" stroke-width="1"/></pattern></defs><g clip-path="url(#c)"><rect width="900" height="589" fill="#0B1011"/><rect width="900" height="589" fill="url(#g)"/><text x="40" y="44" class="m" font-size="13" letter-spacing="3" fill="#46544F">EXPERIENCE / 01</text><circle cx="708" cy="40" r="4" fill="#3DFFA8" class="pulse"/><text x="860" y="45" text-anchor="end" class="m" font-size="15" fill="#E8F0EC">2026 — PRESENT</text><text x="40" y="104" class="s" font-size="40" font-weight="800" fill="#E8F0EC">Smart Aurum<tspan fill="#