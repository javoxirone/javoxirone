<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262" role="img" aria-labelledby="t d" fill="none"><title id="t">Engineering toolkit</title><desc id="d">Periodic-table style grid of tools: Python, Django, FastAPI, SQLAlchemy, PostgreSQL, Redis, pgvector, Docker, Linux, Nginx, AWS, Cloudflare, Celery, Git.</desc><style>
.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.s{font-family:Inter,'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
.in{animation:in .5s ease-out backwards}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.in{animation:none}}
